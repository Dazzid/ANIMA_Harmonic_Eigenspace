<html>

<head>
    <meta charset="UTF-8">
    <title>ANIMA - Unified App</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    
    <!-- Load BOTH CSS files - switch will be handled by showing/hiding containers -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal_studio_style.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="keyboard_style.css">
    
    <!-- Load p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    
    <!-- UNIFIED APP - ALL CODE IN anima.js -->
    <!-- Load common MIDI scripts -->
    <script src="midi_mpe.js"></script>
    <script src="midi_piano.js"></script>
    <script src="launchpad.js"></script>
    
    <!-- Load EigenSpace component scripts (NOT test.js - code is in anima.js) -->
    <script src="binary-loader.js"></script>
    <script src="adsr.js"></script>
    <script src="colorbar-slider.js"></script>
    <script src="chord_visualization.js"></script>
    <script src="info_overlay.js"></script>
    <script src="modal_studio_info_overlay.js"></script>
    <script src="key_map.js"></script>
    <script src="grid.js"></script>
    
    <!-- Load Modal Studio component scripts (NOT modal_studio_main.js or sketch - code is in anima.js) -->
    <!-- NOTE: modal_studio_adsr.js removed - using shared adsr.js instead -->
    <script src="modal_studio_KeyMap.js"></script>
    <script src="modal_studio_audio.js"></script>
    <script src="modal_studio_Note.js"></script>
    <script src="modal_studio_Chord.js"></script>
    <script src="modal_studio_Mode.js"></script>
    <script src="modal_studio_ScaleEditor.js"></script>
    <script src="modal_studio_VoicingEditor.js"></script>
    <script src="modal_studio_Grid.js"></script>
    <script src="modal_studio_DraggingChords.js"></script>
    <script src="modal_studio_shaders.js"></script>
    
    <!-- Scene modules load before the router -->
    <script src="eigenspace.js"></script>
    <script src="modal_studio_app.js"></script>
    <script src="keyboard.js"></script>
    <!-- Load ANIMA router LAST (SceneManager + p5 sketch + DOM wiring) -->
    <script src="anima.js"></script>
    <!-- Navigation menu (reads window.ANIMA, so it loads after the router) -->
    <script src="menu.js"></script>
</head>

<body>
    <!-- EIGENSPACE SCENE -->
    <div id="eigenspace-app">
        <div id="container">
            <div id="header">
                <h1>Harmonic Eigenspace</h1>
            </div>
            <div id="progress-container" style="display:none;">
                <div id="progress-bar"></div>
                <div id="progress-text">Computing: 0%</div>
            </div>
            <div id="eigenspace-audio-gui"></div>
            <div id="chord-visualization-container"></div>
            <div id="colorbar-container"></div>
            <div id="plot"></div>
            <div id="click-output">Computing visualization...</div>
        </div>
        <button id="viz-mode-toggle">Switch to Full 3D View</button>
        <button id="nav-to-modalstudio">Modal Studio</button>
    </div>

    <!-- MODALSTUDIO SCENE -->
    <div id="modalstudio-app" style="display: none;">
        <div id="scene-controls">
            <button id="nav-to-eigenspace" class="scene-button">Harmonic Eigenspace</button>
            <button id="scene-toggle" class="scene-button">
                <span id="scene-label">Modal Interchange</span>
            </button>
            <button id="audio-toggle" class="scene-button">
                <span id="audio-label">Audio Settings: Show</span>
            </button>
            <button id="modalstudio-midi-toggle" class="scene-button">
                <span class="midi-icon">🎹</span>
                <span>MIDI</span>
            </button>
        </div>
        <div id="modalstudio-audio-gui" style="display: none;"></div>
        <div id="canvas-container"></div>
    </div>

    <!-- KEYBOARD SCENE (53-TET Lumatone hex grid) -->
    <div id="keyboard-app">
        <div id="home"></div>
        <div id="keyboard-audio-gui" style="display: none;"></div>
        <aside id="chord-panel">
            <div id="chord-panel-header">
                <button id="single-note-btn" class="chord-btn">Single note</button>
                <div id="chord-mode">
                    <button id="mode-fixed-btn" class="chord-btn selected">Fixed</button>
                    <button id="mode-functional-btn" class="chord-btn">Functional</button>
                </div>
                <button id="chord-panel-close" aria-label="Close chord menu">&times;</button>
            </div>
            <div id="chord-fundamental-section" style="display:none;">
                <div class="ext-section">
                    <span class="ext-label">Fundamental</span>
                    <div id="chord-fundamental"></div>
                </div>
            </div>
            <div id="chord-triads"></div>
            <div id="chord-sus"></div>
            <table id="chord-grid"><thead><tr></tr></thead><tbody></tbody></table>
            <div class="ext-section"><span class="ext-label">9ths</span><div id="chord-9ths"></div></div>
            <div class="ext-section"><span class="ext-label">11ths</span><div id="chord-11ths"></div></div>
        </aside>
    </div>
</body>

</html>
